services:
  # --- 1. PostgreSQL Database ---
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    # Reachable only from other containers on this network, not the host.
    expose:
      - "5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Check over TCP (-h 127.0.0.1): during first-run initialisation Postgres
    # runs a temporary socket-only server that would pass a socket check too
    # early. First-run initialisation can take ~95s on Windows/WSL volumes,
    # hence the long start_period.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 180s

  # --- 2. Qdrant Database ---
  qdrant-db:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    restart: always
    # Reachable only from other containers on this network.
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # --- 3. The API (FastAPI backend) ---
  # api and ui run as separate services, each with its own healthcheck.
  api:
    build:
      context: .
      dockerfile: src/Dockerfile.api
    container_name: api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy
      qdrant-db:
        condition: service_started # Qdrant starts fast, this is fine
    volumes:
      - ./data:/app/data
      # Operational scripts, mounted read-only rather than built into the image.
      - ./scripts:/app/scripts:ro
    healthcheck:
      # Uses urllib because the slim image has no curl. Startup loads the
      # models and agent before /health responds (~20-40s).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --- 3b. The UI (Streamlit frontend) ---
  ui:
    build:
      context: .
      dockerfile: src/Dockerfile.ui
    container_name: ui
    restart: always
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- 4. Airflow metadata DB, kept separate from the app database ---
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    # Same healthcheck settings as postgres-db.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 180s

  # --- 5. Airflow init: migrates the metadata DB and creates the admin
  # user. The webserver and scheduler start after it exits successfully. ---
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Start DAGs unpaused so uploads are processed on a fresh install.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      # Airflow Connections, read in dags/support.py with
      # BaseHook.get_connection().
      AIRFLOW_CONN_SMARTSENSE_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      AIRFLOW_CONN_SMARTSENSE_QDRANT: http://qdrant-db:6333
      AIRFLOW_CONN_SMARTSENSE_INTERNAL_API: >-
        {"conn_type": "http", "host": "api", "port": 8000, "extra": {"api_key": "${INTERNAL_API_KEY}"}}
    volumes:
      - ./data:/app/data
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || true

  # --- 6. Airflow webserver (UI + REST API) ---
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-webserver
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *airflow-common-env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
    command: webserver

  # --- 7. Airflow scheduler (LocalExecutor, no separate workers) ---
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *airflow-common-env
    volumes:
      - ./data:/app/data
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
    command: scheduler

  # --- 8. Optional Cloudflare quick tunnel (`docker compose --profile
  # public up -d`). Exposes only the ui; the temporary trycloudflare.com URL
  # is printed in this service's logs and changes on every restart. ---
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: tunnel
    profiles: ["public"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://ui:8501
    depends_on:
      ui:
        condition: service_healthy

# --- Persistent volumes ---
volumes:
  postgres_data:
  qdrant_data:
  airflow_postgres_data: