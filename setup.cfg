[flake8]
max-line-length = 110
# E203/W503 conflict with black's formatting choices.
extend-ignore = E203, W503
exclude = .git,__pycache__
# agents.py's long lines are the LLM system prompt and tool description
# strings -- content the agent actually sees, not sloppy code. Reflowing
# them to fit 110 chars would mean either changing what gets sent to the
# LLM (inserting real newlines) or splitting them into concatenated
# string literals purely to satisfy the linter; ignoring E501 for this
# one file is more honest than either.
per-file-ignores =
    src/agents.py: E501
